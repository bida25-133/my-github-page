     <!--Bootstrap CSS-->

    <!--Custom CSS-->

</head>
<body>
    <header>
        <nav class ="navbar-expand -lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">LCrochets Website!</a>
                <button class="navbar-toggler" type="button" data-bs-toogle="collapse" data-bs-target="navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>
                        
                    </ul>
                    
                </div>
            </div>
        </nav>   
    </header>

    <main class="container my-5">
        <h2>Contact Me</h2>
        <p>If you'd like to purchase an order with us, you can email us at<a href="mailto:example@example.com" class="btn btn-success">LCrochets@gmail.com. Or you can simply call us at +26778 607 123.</a></p>
    </main>

    <form>
<h3>ORDER WITH US!</h3>

        <div>
           <label for="fname">First name:</label>
           <input type="text" id="fname" name="fname" placeholder="Mariana">
        </div>

        <div>
           <label for="lname">Last name:</label>
           <input type="text" id="lname" name="lname" placeholder="De La Croux">
        </div>

        <div>
           <label for="LCrochet pieces">Choose a crochet piece you want to order:</label>
           <select id="LCrochet pieces" name="LCrochet pieces">
              <option value="Scrunchie">Scrunchie</option>
              <option value="Messenger bag">Messenger bag</option>
              <option value="Bouquet of roses">Bouquet of roses</option>
              <option value="Slouch beanie">Slouch beanie</option>
              <option value="Sunhat">Sunhat</option>
           </select>
        </div>

        <div>
            <label for="contact details">Contact details</label>
            <input type="number" id="number" placeholder="+267 71816735">
        </div>

        <div>
            <input type="Submit" value="Submit">
        </div>

    </form>
    
    <footer>
        <p>&copy; 2026 Lucia Molalagare</p>
    </footer>
    <!--Bootstrap JS and dependencies -->
